[package]
name = "muxsu-app"
version = "0.8.2"
description = "Switch one shared monitor safely between Windows and macOS"
authors = ["MuxSU contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "muxsu_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Keep Windows GUI builds console-free by default. Developers can opt in with
# `pnpm tauri dev --features console` when terminal logs are needed.
console = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
hmac.workspace = true
muxsu-core = { path = "../crates/muxsu-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10"
regex = "1"
ring.workspace = true
# Same features as the updater's copy, so the build carries one HTTP client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `start_paused` tests run the wait loops on a virtual clock, so a test that
# covers a 45-second budget still finishes instantly.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true
